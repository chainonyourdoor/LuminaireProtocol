name: "✨ Luminaire Protocol"
run-name: "${{ inputs.run_mode == 'Dry Run' && '🧪' || inputs.run_mode == 'Warm Run' && '🔥' || inputs.run_mode == 'Build' && '🔬' || '🚀' }} ${{ inputs.kernel_version }} | ${{ inputs.lto_mode != 'NONE' && format('{0} LTO x ', inputs.lto_mode) || '' }}${{ contains(inputs.build_system, 'AOSP') && 'AOSP' || contains(inputs.build_system, 'Cirrus') && 'Cirrus' || contains(inputs.build_system, 'Neutron') && 'Neutron' || contains(inputs.build_system, 'WeebX') && 'WeebX' || 'Zyc' }} (${{ inputs.run_mode }})"

on:
  workflow_dispatch:
    inputs:
      build_system:
        description: "Build System"
        type: choice
        default: "Make - Neutron"
        options:
          - "Make - AOSP"
          - "Make - Cirrus"
          - "Make - Neutron"
          - "Make - WeebX"
          - "Make - Zyc"
      kernel_version:
        description: "Kernel Version"
        type: choice
        default: "6.1"
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.6-konoha"
          - "6.12"
      kernel_branch_override:
        description: "Kernel Branch Override"
        type: string
        default: ""
      ksunext:
        description: "KernelSU-Next"
        type: boolean
        default: true
      kowsu:
        description: "KowSU"
        type: boolean
        default: false
      resukisu:
        description: "ReSukiSU"
        type: boolean
        default: true
      sukisu:
        description: "SukiSU-Ultra"
        type: boolean
        default: true
      vanilla:
        description: "Vanilla"
        type: boolean
        default: true
      susfs:
        description: "SuSFS"
        type: choice
        default: "enable"
        options:
          - "enable"
          - "disable"
      mountless_engine:
        description: "Mountless Engine"
        type: choice
        default: "none"
        options:
          - "none"
          - "nomount"
          - "zeromount"
      bbrv3:
        description: "BBRv3"
        type: boolean
        default: true
      bbg:
        description: "BBG"
        type: boolean
        default: true
      rekernel:
        description: "Re:Kernel"
        type: boolean
        default: true
      droidspaces:
        description: "Droidspaces"
        type: boolean
        default: true
      ntsync:
        description: "NTSync"
        type: boolean
        default: true
      wireguard:
        description: "WireGuard"
        type: boolean
        default: true
      lz4zstd:
        description: "LZ4 1.10.0 + ZSTD 1.5.7"
        type: boolean
        default: true
      lz4kd:
        description: "LZ4KD"
        type: boolean
        default: true
      kpatch_next:
        description: "KPatch-Next"
        type: boolean
        default: true
      kasumi:
        description: "Kasumi (Experimental)"
        type: boolean
        default: false
      lto_mode:
        description: "LTO"
        type: choice
        default: "THIN"
        options:
          - "NONE"
          - "THIN"
          - "FULL"
      run_mode:
        description: "Run Mode"
        type: choice
        default: "Build"
        options:
          - "Dry Run"
          - "Warm Run"
          - "Build"
          - "Release"
      changelog:
        description: "Changelog on Post"
        type: string
        default: ""
      update_arsenal:
        description: "Update Arsenal"
        type: choice
        default: "no"
        options:
          - "yes"
          - "no"

env:
  DEBIAN_FRONTEND: noninteractive
  IS_MAKE: ${{ startsWith(inputs.build_system, 'Make') }}

jobs:

  # ======================================================
  # PREPARE MATRIX + ARSENAL
  # ======================================================
  prepare-matrix:
    name: "Prepare Arsenal"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      addons: ${{ steps.set.outputs.addons }}
      safe_ref: ${{ steps.set.outputs.safe_ref }}

      cache_refreshed: ${{ inputs.update_arsenal == 'yes' }}

    env:
      PERSONAL_TOKEN:   ${{ secrets.PERSONAL_TOKEN }}
      USE_KERNEL_CACHE: ${{ inputs.update_arsenal != 'yes' }}
      USE_AK3_CACHE:    ${{ inputs.update_arsenal != 'yes' }}
      USE_CLANG_CACHE:  ${{ inputs.update_arsenal != 'yes' }}
      KERNEL_VERSION:   ${{ inputs.kernel_version }}
      KERNEL_BRANCH_OVERRIDE: ${{ inputs.kernel_branch_override }}
      BUILD_SYSTEM:     ${{ inputs.build_system }}
      CCACHE_DIR:       ${{ startsWith(inputs.build_system, 'Make') && format('{0}/.ccache', github.workspace) || '' }}
      CCACHE_MAXSIZE:   ${{ startsWith(inputs.build_system, 'Make') && '900M' || '' }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Build Variant Matrix"
        id: set
        env:
          SUSFS_ENABLED: ${{ inputs.susfs == 'enable' }}
        run: |
          variants=()
          ${{ inputs.vanilla }}  && variants+=("{\"kernel_variant\":\"VANILLA\",\"susfs\":false}")
          ${{ inputs.resukisu }} && variants+=("{\"kernel_variant\":\"RESUKISU\",\"susfs\":${SUSFS_ENABLED}}")
          ${{ inputs.sukisu }}   && variants+=("{\"kernel_variant\":\"SUKISU\",\"susfs\":${SUSFS_ENABLED}}")
          ${{ inputs.ksunext }} && variants+=("{\"kernel_variant\":\"KSUNEXT\",\"susfs\":${SUSFS_ENABLED}}")
          ${{ inputs.kowsu }}   && variants+=("{\"kernel_variant\":\"KOWSU\",\"susfs\":false}")

          if [ ${#variants[@]} -eq 0 ]; then
            echo "No root solutions selected!"
            exit 1
          fi

          matrix_json=$(printf '%s\n' "${variants[@]}" | jq -cs '{include: .}')
          echo "matrix=${matrix_json}" >> $GITHUB_OUTPUT

          # Single source of truth for the ADDONS list — reused by Start-Build
          # and notify-channel via this job's output, instead of each job
          # rebuilding the same string from inputs independently.
          ADDONS="${{ inputs.bbrv3 && 'bbrv3,' || '' }}${{ inputs.bbg && 'bbg,' || '' }}${{ inputs.rekernel && 'rekernel,' || '' }}${{ inputs.droidspaces && 'droidspaces,' || '' }}${{ inputs.ntsync && 'ntsync,' || '' }}${{ inputs.wireguard && 'wireguard,' || '' }}${{ inputs.lz4zstd && 'lz4zstd,' || '' }}${{ inputs.lz4kd && 'lz4kd,' || '' }}${{ inputs.mountless_engine != 'none' && format('{0},', inputs.mountless_engine) || '' }}${{ inputs.kasumi && 'kasumi,' || '' }}${{ inputs.kpatch_next && 'kpatch-next,' || '' }}"
          echo "addons=${ADDONS}" >> $GITHUB_OUTPUT

          # "/" -> "-" so this is safe to use as a filesystem path component
          # (cache asset filenames) wherever ref_name is needed downstream.
          SAFE_REF="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          echo "safe_ref=${SAFE_REF}" >> $GITHUB_OUTPUT

      - name: "Setup Arsenal"  # restores clang+arsenal cache (auto-saved if missing), then runs arsenal.sh
        id: setup-arsenal
        uses: ./.github/actions/setup-arsenal
        with:
          build-system:   ${{ inputs.build_system }}
          kernel-version: ${{ inputs.kernel_version }}
          kernel-branch-override: ${{ inputs.kernel_branch_override }}
          update-arsenal: ${{ inputs.update_arsenal }}
          gh-token:       ${{ secrets.PERSONAL_TOKEN }}

  # ======================================================
  # BUILD VARIANT (parallel)
  # ======================================================
  Start-Build:
    name: "Build Kernel (${{ matrix.kernel_variant }}${{ matrix.susfs && '+SUSFS' || '' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: prepare-matrix
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false

    env:
      PERSONAL_TOKEN:              ${{ secrets.PERSONAL_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      USE_KERNEL_CACHE:            "true"
      USE_AK3_CACHE:               "true"
      USE_CLANG_CACHE:             "true"
      CACHE_REFRESHED:             ${{ needs.prepare-matrix.outputs.cache_refreshed }}
      KERNEL_VARIANT:               ${{ matrix.kernel_variant }}
      SUSFS_ENABLED:               ${{ matrix.susfs }}
      KERNEL_VERSION:              ${{ inputs.kernel_version }}
      KERNEL_BRANCH_OVERRIDE:      ${{ inputs.kernel_branch_override }}
      LTO_MODE:                  ${{ inputs.lto_mode }}
      RUN_MODE:                    ${{ inputs.run_mode }}
      DRY_RUN:                     ${{ inputs.run_mode == 'Dry Run' }}
      BUILD_SYSTEM:                ${{ inputs.build_system }}
      ADDONS:                      ${{ needs.prepare-matrix.outputs.addons }}
      CCACHE_DIR:                  ${{ startsWith(inputs.build_system, 'Make') && format('{0}/.ccache', github.workspace) || '' }}
      CCACHE_MAXSIZE:              ${{ startsWith(inputs.build_system, 'Make') && '900M' || '' }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Free Disk Space"
        run: |
          sudo mv /usr/share/dotnet        /tmp/_trash_dotnet        2>/dev/null || true
          sudo mv /usr/local/lib/android   /tmp/_trash_android       2>/dev/null || true
          sudo mv /opt/ghc                 /tmp/_trash_ghc           2>/dev/null || true
          sudo mv /usr/lib/jvm             /tmp/_trash_jvm           2>/dev/null || true
          sudo mv /usr/share/swift         /tmp/_trash_swift         2>/dev/null || true
          sudo mv /usr/local/share/powershell /tmp/_trash_pwsh      2>/dev/null || true
          (sudo nice -n 19 ionice -c 3 rm -rf \
            /tmp/_trash_dotnet /tmp/_trash_android /tmp/_trash_ghc \
            /tmp/_trash_jvm /tmp/_trash_swift /tmp/_trash_pwsh \
            /var/lib/docker /var/cache/snapd /home/linuxbrew \
          ) &
          mkdir -p /dev/shm/ldcache
          wait

      - name: "Setup Swap Space"
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 24

      - name: "Tune Swappiness"  # push pages to swap earlier, before the OOM killer
        run: sudo sysctl -w vm.swappiness=80

      - name: "Setup Build Environment"  # restore-only: clang, arsenal, ccache, lto
        id: setup-build-env
        uses: ./.github/actions/setup-build-env
        with:
          build-system:   ${{ inputs.build_system }}
          kernel-version: ${{ inputs.kernel_version }}
          kernel-branch-override: ${{ inputs.kernel_branch_override }}
          ref-name:       ${{ needs.prepare-matrix.outputs.safe_ref }}
          kernel-variant:  ${{ matrix.kernel_variant }}
          susfs:          ${{ matrix.susfs }}
          lto-mode:     ${{ inputs.lto_mode }}
          gh-token:       ${{ secrets.PERSONAL_TOKEN }}
          update-arsenal: ${{ inputs.update_arsenal }}
          kpatch-next-selected: ${{ contains(needs.prepare-matrix.outputs.addons, 'kpatch-next') }}

      - name: "Disk Usage"
        run: df -h && du -sh ~/kernel-cache/ 2>/dev/null || true

      - name: "Cache KPatch-Next"  # source clone + aarch64-none-elf toolchain + Android NDK — restores if present; auto-saves at end of job if it was missing
        if: contains(needs.prepare-matrix.outputs.addons, 'kpatch-next')
        uses: actions/cache@v6
        with:
          path: |
            ~/kpatch-next-src-cache
            ~/kpatch-toolchain-cache
            ~/kpatch-ndk-cache
          key: kpatch-next-cache

      - name: "Scout Upstream Refs"  # decides pinned vs candidate ref for KSU fork / SuSFS
        if: matrix.kernel_variant != 'VANILLA'
        run: bash kernel/ksu/checkpoint/scout.sh

      - name: "Cooking (${{ matrix.kernel_variant }}${{ matrix.susfs && '+SUSFS' || '' }})"
        id: build
        run: bash build.sh

      - name: "Ccache Stats"
        if: always() && env.IS_MAKE == 'true'
        run: ~/ccache-bin/ccache --show-stats

      - name: "Checkpoint (Promote/Blacklist)"  # updates manifest.json, files an issue on failed candidates
        if: always() && matrix.kernel_variant != 'VANILLA' && inputs.run_mode != 'Dry Run'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          OUTCOME="${{ steps.build.outcome }}"
          [ "$OUTCOME" = "success" ] && OUTCOME="success" || OUTCOME="failure"
          case "${{ matrix.kernel_variant }}" in
            RESUKISU)
              if [ "${{ matrix.susfs }}" = "true" ]; then
                COMPONENTS="resukisu susfs_resukisu"
              else
                COMPONENTS="resukisu"
              fi
              ;;
            SUKISU)
              if [ "${{ matrix.susfs }}" = "true" ]; then
                COMPONENTS="sukisu_builtin susfs_sukisu"
              else
                COMPONENTS="sukisu"
              fi
              ;;
            KSUNEXT)
              if [ "${{ matrix.susfs }}" = "true" ]; then
                COMPONENTS="ksunext_susfs_fork susfs_ksunext"
              else
                COMPONENTS="ksunext"
              fi
              ;;
          esac
          bash kernel/ksu/checkpoint/engine.sh "$OUTCOME" $COMPONENTS

      - name: "Save Build Caches"  # LTO and ccache, both to GH Release
        if: always() && env.IS_MAKE == 'true'
        timeout-minutes: 15
        uses: ./.github/actions/save-build-caches
        with:
          build-system:   ${{ inputs.build_system }}
          lto-mode:     ${{ inputs.lto_mode }}
          lto-asset-name: lto-data-${{ inputs.kernel_version }}-${{ matrix.kernel_variant }}${{ matrix.susfs && '+SUSFS' || '' }}-${{ steps.setup-build-env.outputs.clang-variant-upper }}${{ inputs.lto_mode != 'NONE' && format('-{0}', inputs.lto_mode) || '' }}-${{ needs.prepare-matrix.outputs.safe_ref }}.tar.zst
          ccache-filename: ccache-data-${{ inputs.kernel_version }}-${{ matrix.kernel_variant }}${{ matrix.susfs && '+SUSFS' || '' }}-${{ steps.setup-build-env.outputs.clang-variant-upper }}${{ inputs.lto_mode != 'NONE' && format('-{0}', inputs.lto_mode) || '' }}-${{ needs.prepare-matrix.outputs.safe_ref }}.tar.zst
          gh-token:       ${{ secrets.PERSONAL_TOKEN }}

      - name: "Upload Variant Link"  # for channel post aggregation
        if: inputs.run_mode == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: variant-link-${{ matrix.kernel_variant }}${{ matrix.susfs && '-susfs' || '' }}
          path: variant-links/
          if-no-files-found: ignore

  # ======================================================
  # NOTIFY CHANNEL
  # ======================================================
  notify-channel:
    name: "Notify Channel"
    runs-on: ubuntu-latest
    needs: [prepare-matrix, Start-Build]
    if: inputs.run_mode == 'Release' && always()

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Download Variant Links"
        uses: actions/download-artifact@v8
        with:
          pattern: variant-link-*
          path: /tmp/variant-links
          merge-multiple: true

      - name: "Send Channel Post"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAPH_TOKEN:    ${{ secrets.TELEGRAPH_TOKEN }}
          LUMINAIRE_PATCH_DIR: ${{ github.workspace }}
          LINKS_DIR:           /tmp/variant-links
          KERNEL_VERSION:      ${{ inputs.kernel_version }}
          ADDONS:              ${{ needs.prepare-matrix.outputs.addons }}
          CHANGELOG:           ${{ inputs.changelog }}
          EXPECTED_MATRIX_JSON: ${{ needs.prepare-matrix.outputs.matrix }}
          GITHUB_SHA:          ${{ github.sha }}
          GITHUB_SERVER_URL:   ${{ github.server_url }}
          GITHUB_REPOSITORY:   ${{ github.repository }}
          GITHUB_RUN_ID:       ${{ github.run_id }}
        run: bash release/telegram/channel_post.sh
