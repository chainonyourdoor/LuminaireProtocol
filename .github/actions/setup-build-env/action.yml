name: "Setup Build Environment"
description: "Clang, arsenal, ccache, and LTO cache restore for Start-Build job"

inputs:
  build-system:
    required: true
  ref-name:
    required: true
  kernel-branch:
    required: true
  kernel-variant:
    required: true
  susfs:
    required: true
  lto-mode:
    required: true
  gh-token:
    required: true

outputs:
  clang-variant:
    description: "Stripped clang variant name (e.g. Cirrus, Neutron)"
    value: ${{ steps.clang-key.outputs.clang_variant }}
  clang-variant-upper:
    description: "Uppercased clang variant (e.g. NEUTRON) — for cache asset filenames only, not cache keys"
    value: ${{ steps.clang-key.outputs.clang_variant_upper }}

runs:
  using: composite
  steps:
    - name: "Derive Clang Variant"  # keep in sync with setup-arsenal
      id: clang-key
      if: startsWith(inputs.build-system, 'Make')
      shell: bash
      run: |
        variant="${{ inputs.build-system }}"
        variant="${variant#Make - }"
        echo "clang_variant=${variant}" >> $GITHUB_OUTPUT
        echo "clang_variant_upper=${variant^^}" >> $GITHUB_OUTPUT

    - name: "Restore Clang Cache"
      if: startsWith(inputs.build-system, 'Make')
      uses: actions/cache/restore@v6
      with:
        path: ~/clang-cache
        key: clang-${{ steps.clang-key.outputs.clang_variant }}

    - name: "Restore Arsenal Cache"  # tools only (ccache binary, AK3, apt deps), no kernel source
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/ccache-bin
          ~/ak3-cache
          ~/.apt-cache
        key: arsenal

    - name: "Restore Kernel Source Cache"  # one cache per resolved kernel branch, never shared across branches
      uses: actions/cache/restore@v6
      with:
        path: ~/kernel-cache
        key: kernel-${{ inputs.kernel-branch }}

    - name: "Restore ccache"
      if: startsWith(inputs.build-system, 'Make')
      uses: ./.github/actions/restore-caches
      with:
        # Must match the Save step's ccache-filename in build.yml exactly
        # (same field order, same susfs/mode handling) or restore silently
        # misses the asset the save step actually wrote.
        ccache-filename: ccache-data-${{ inputs.kernel-branch }}-${{ inputs.kernel-variant }}${{ inputs.susfs == 'true' && '+SUSFS' || '' }}-${{ steps.clang-key.outputs.clang_variant_upper }}${{ inputs.lto-mode != 'NONE' && format('-{0}', inputs.lto-mode) || '' }}-${{ inputs.ref-name }}.tar.zst
        gh-token: ${{ inputs.gh-token }}

    - name: "Restore LTO Cache"
      if: startsWith(inputs.build-system, 'Make') && inputs.lto-mode == 'THIN'
      uses: ./.github/actions/restore-lto-cache
      with:
        # Must match the Save step's lto-asset-name in build.yml exactly.
        asset-name: lto-data-${{ inputs.kernel-branch }}-${{ inputs.kernel-variant }}${{ inputs.susfs == 'true' && '+SUSFS' || '' }}-${{ steps.clang-key.outputs.clang_variant_upper }}${{ inputs.lto-mode != 'NONE' && format('-{0}', inputs.lto-mode) || '' }}-${{ inputs.ref-name }}.tar.zst
        gh-token:   ${{ inputs.gh-token }}
