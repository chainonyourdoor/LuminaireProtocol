name: "Setup Arsenal"
description: "Restore clang + arsenal cache (auto-saved at end of job if missing) for prepare-matrix job"

inputs:
  build-system:
    required: true
  kernel-version:
    required: true
  kernel-branch-override:
    required: false
    default: ""
  update-arsenal:
    required: true
  gh-token:
    required: true

outputs:
  clang-variant:
    description: "Stripped clang variant name (e.g. Cirrus, Neutron)"
    value: ${{ steps.clang-key.outputs.clang_variant }}

runs:
  using: composite
  steps:
    - name: "Derive Clang Variant"  # keep in sync with setup-build-env
      id: clang-key
      if: startsWith(inputs.build-system, 'Make')
      shell: bash
      run: |
        variant="${{ inputs.build-system }}"
        variant="${variant#Make - }"
        echo "clang_variant=${variant}" >> $GITHUB_OUTPUT

    - name: "Derive Cache Keys"  # keep in sync with setup-build-env
      id: cache-keys
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        source functions.sh
        KERNEL_VERSION="${{ inputs.kernel-version }}"
        ANDROID_VERSION="$(resolve_android_version)"
        OVERRIDE="${{ inputs.kernel-branch-override }}"
        OVERRIDE="${OVERRIDE//\//-}"
        KERNEL_BRANCH="${OVERRIDE:-${ANDROID_VERSION}-${KERNEL_VERSION}}"
        echo "arsenal_key=arsenal" >> $GITHUB_OUTPUT
        echo "kernel_key=kernel-${KERNEL_BRANCH}" >> $GITHUB_OUTPUT

    - name: "Force Refresh (delete old caches)"
      if: inputs.update-arsenal == 'yes'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        gh cache delete "${{ steps.cache-keys.outputs.arsenal_key }}" -R "${{ github.repository }}" 2>/dev/null || true
        gh cache delete "${{ steps.cache-keys.outputs.kernel_key }}" -R "${{ github.repository }}" 2>/dev/null || true
        if [ "${{ startsWith(inputs.build-system, 'Make') }}" = "true" ]; then
          gh cache delete "clang-${{ steps.clang-key.outputs.clang_variant }}" -R "${{ github.repository }}" 2>/dev/null || true
        fi

    - name: "Cache Clang"  # restores if present; auto-saves at end of job if it was missing
      if: startsWith(inputs.build-system, 'Make')
      uses: actions/cache@v6
      with:
        path: ~/clang-cache
        key: clang-${{ steps.clang-key.outputs.clang_variant }}

    - name: "Cache Arsenal"  # restores if present; auto-saves at end of job if it was missing — tools only (ccache binary, AK3, apt deps), no kernel source
      uses: actions/cache@v6
      with:
        path: |
          ~/ccache-bin
          ~/ak3-cache
          ~/.apt-cache
        key: ${{ steps.cache-keys.outputs.arsenal_key }}

    - name: "Cache Kernel Source"  # restores if present; auto-saves at end of job if it was missing — one cache per resolved kernel branch, never shared across branches
      uses: actions/cache@v6
      with:
        path: ~/kernel-cache
        key: ${{ steps.cache-keys.outputs.kernel_key }}

    - name: "Run Arsenal"
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash arsenal.sh
